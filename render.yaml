# Render Blueprint for a stable HTTPS MCP endpoint for OpenAI Plugin submission.
services:
  - type: web
    name: glasses-finder-mcp
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8790
      - key: PUBLISHED_APP
        value: glasses-finder
      - key: PUBLIC_BASE_URL
        value: https://glasses-finder-mcp.onrender.com
      - key: REQUIRE_AFFILIATE_PRODUCTS
        value: "false"
      - key: OPENAI_APPS_CHALLENGE_TOKEN
        sync: false
      - key: AFFILIATE_CONFIG_JSON
        sync: false
